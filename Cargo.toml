[package]
name = "memo"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Memo - 现代、简单、轻量的跨平台便签（GPUI 界面、redb 存储、自动保存）"
build = "build.rs"

[dependencies]
# GPUI：Zed 编辑器的 GPU 加速 UI 框架（crates.io 发布版）
gpui = "0.2.2"
# gpui-component：提供多行输入框（滚动 / IME / 选区 / 撤销 / 右键菜单 / 剪贴板）与 Root
gpui-component = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
