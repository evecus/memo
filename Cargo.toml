[package]
name = "memo"
version = "0.2.0"
edition = "2021"
description = "Memo - 现代、简单、轻量的跨平台便签（redb 存储、自动保存）"
build = "build.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
